---
schema_version: 3
tasks:
  probabilistic_switching:
    requires: [bpod, box, cameras]
    settings:
      cameras: {record: {video: true}}
      tasks:
        probabilistic_switching:
          probabilities: [[10, 50], [50, 10], [10, 90], [90, 10], [50, 50], [50, 90], [90, 50]]
          min_block_length: 20
          n_max_trials: 1500
          reward_amount_ul: 2.0
          stop_trials: {enabled: false, proportion: 0.2}
          stimulation: {enabled: false, timepoint: ACTION_INIT, pulse_frequency_hz: 30}
          ports: {left: 1, center: 2, right: 3}
          light: {ports: [center], intensity: 50}
    modes:
      habituation:
        tasks:
          probabilistic_switching:
            probabilities: [[100, 99], [99, 100]]
            reward_amount_ul: 3.0
            n_max_trials: 300
      stage10deterministic:
        tasks:
          probabilistic_switching:
            probabilities: [[100, 0], [0, 100]]
            reward_amount_ul: 3.0
            n_max_trials: 300
      expert:
        tasks:
          probabilistic_switching:
            probabilities: [[90, 10], [10, 90], [90, 50], [50, 90], [10, 50], [50, 10], [50, 50]]
            n_max_trials: 1500
      probe:
        tasks:
          probabilistic_switching:
            stop_trials: {enabled: true, proportion: 0.3}
            n_max_trials: 500
